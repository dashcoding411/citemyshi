<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <title>citemyshi | Free citation generator</title>
  <meta name="description" content="Free citation generator for APA, MLA, Chicago, Harvard and 10,000+ styles. Cite websites, books, articles and videos.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1a17'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-size='22' fill='%23f7f6f2'%3Ec%3C/text%3E%3Ccircle cx='24.5' cy='22.5' r='2.2' fill='%23b8431f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    try { const t = JSON.parse(localStorage.getItem('citemyshi:v1') || '{}').theme; if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Projects"></aside>
    <div class="backdrop" id="backdrop"></div>
    <main class="main">
      <div class="main-inner">
        <header class="topbar" id="topbar"></header>
        <section class="cite-card" id="citeCard" aria-label="Create a citation"></section>
        <section class="bib" id="bib" aria-label="Bibliography"></section>
      </div>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
