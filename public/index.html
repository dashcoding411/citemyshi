<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>citemyshi — Free Citation Generator</title>
  <meta name="description" content="Free citation generator for APA, MLA, Chicago, Harvard and 10,000+ styles. Cite websites, books, articles and videos.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b5bfd'/%3E%3Cstop offset='1' stop-color='%237b5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='29' font-family='Georgia' font-size='28' fill='white' text-anchor='middle'%3E%E2%80%9C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700;750&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    try { const t = JSON.parse(localStorage.getItem('citemyshi:v1') || '{}').theme; if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Projects"></aside>
    <div class="backdrop" id="backdrop"></div>
    <main class="main">
      <div class="main-inner">
        <header class="topbar" id="topbar"></header>
        <section class="cite-card" id="citeCard" aria-label="Create a citation"></section>
        <section class="bib" id="bib" aria-label="Bibliography"></section>
      </div>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
