# Render's free plan sleeps after 15 idle minutes, making the next visit take
# ~30s. This pings the site every 10 minutes so it stays awake.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables →
# New variable RENDER_URL = https://your-app.onrender.com
name: Keep Render awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.RENDER_URL }}/healthz" || true
