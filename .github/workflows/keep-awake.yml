# Render's free plan sleeps after 15 idle minutes, making the next visit take
# ~30s. This pings the site every 10 minutes so it stays awake.
# Pings https://citemyshi.onrender.com by default; set a repo variable
# RENDER_URL to point it somewhere else.
name: Keep Render awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.RENDER_URL || 'https://citemyshi.onrender.com' }}/healthz" || true
