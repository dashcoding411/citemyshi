services:
  - type: web
    name: citemyshi
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        value: https://citemyshi.web.app
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
